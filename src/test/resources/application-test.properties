# Configuration used by tests (activate with @ActiveProfiles("test")).
# Supplying a dummy key keeps the Spring context startable without a real STRIPE_API_KEY,
# and Stripe's SDK is mocked in the tests anyway.

stripe.api.key=sk_test_dummy

# Do not export traces to Zipkin during tests.
management.tracing.sampling.probability=0.0
management.tracing.export.enabled=false
